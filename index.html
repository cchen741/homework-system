<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作業管理系統 V3</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft JhengHei",sans-serif;
}

body{
display:flex;
background:#f5f6fa;
}

.sidebar{
width:220px;
height:100vh;
background:#2563eb;
color:white;
position:fixed;
padding:20px;
}

.sidebar h2{
margin-bottom:25px;
font-size:22px;
}

.sidebar button{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
background:transparent;
color:white;
text-align:left;
cursor:pointer;
border-radius:6px;
}

.sidebar button:hover{
background:rgba(255,255,255,0.2);
}

.main{
margin-left:220px;
padding:25px;
width:100%;
}

.page{
display:none;
}

.active{
display:block;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h3{
color:#555;
font-size:16px;
}

.card p{
font-size:32px;
font-weight:bold;
margin-top:10px;
}

.section{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

input,
textarea{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:6px;
}

button.action{
background:#2563eb;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:6px;
}

button.delete{
background:#dc2626;
color:white;
border:none;
padding:5px 8px;
border-radius:5px;
cursor:pointer;
}

button.submitBtn{
background:#16a34a;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

ul{
padding-left:20px;
}

.remind{
color:red;
font-weight:bold;
}

</style>
</head>

<body>

<div class="sidebar">

<h2>📚 作業管理系統</h2>

<button onclick="showPage('dashboard')">📊 儀表板</button>

<button onclick="showPage('students')">👨‍🎓 學生管理</button>

<button onclick="showPage('assignments')">📝 作業管理</button>

<button onclick="showPage('attendance')">✅ 點名管理</button>

<button onclick="showPage('submission')">📄 繳交管理</button>

<button onclick="showPage('reminder')">⚠️ 催繳管理</button>

</div>

<div class="main">

<!-- Dashboard -->

<div id="dashboard" class="page active">

<h1>儀表板</h1>

<br>

<div class="cards">

<div class="card">
<h3>學生總數</h3>
<p id="studentCount">0</p>
</div>

<div class="card">
<h3>作業總數</h3>
<p id="assignmentCount">0</p>
</div>

<div class="card">
<h3>未繳交</h3>
<p id="missingCount">0</p>
</div>

</div>

</div>

<!-- Students -->

<div id="students" class="page">

<div class="section">

<h2>學生管理</h2>

<textarea id="studentInput"
placeholder="一行一位學生"></textarea>

<button class="action"
onclick="addStudents()">
新增學生
</button>

<ul id="studentList"></ul>

</div>

</div>

<!-- Assignments -->

<div id="assignments" class="page">

<div class="section">

<h2>作業管理</h2>

<input id="assignmentName"
placeholder="作業名稱">

<input type="date"
id="dueDate">

<button class="action"
onclick="createAssignment()">
新增作業
</button>

<ul id="assignmentList"></ul>

</div>

</div>

<!-- Attendance -->

<div id="attendance" class="page">

<div class="section">

<h2>點名管理</h2>

<table>

<thead>
<tr>
<th>學生</th>
<th>出席</th>
</tr>
</thead>

<tbody id="attendanceBody"></tbody>

</table>

</div>

</div>

<!-- Submission -->

<div id="submission" class="page">

<div class="section">

<h2>作業繳交管理</h2>

<table>

<thead>

<tr>
<th>學生</th>
<th>作業</th>
<th>狀態</th>
</tr>

</thead>

<tbody id="submissionBody"></tbody>

</table>

</div>

</div>

<!-- Reminder -->

<div id="reminder" class="page">

<div class="section">

<h2>催繳管理</h2>

<button class="action"
onclick="generateReminder()">
產生催繳名單
</button>

<ul id="reminderList"></ul>

</div>

</div>

</div>

<script>

let students =
JSON.parse(localStorage.getItem("students")) || [];

let assignments =
JSON.parse(localStorage.getItem("assignments")) || [];

let submissions =
JSON.parse(localStorage.getItem("submissions")) || {};

function saveData(){

localStorage.setItem(
"students",
JSON.stringify(students)
);

localStorage.setItem(
"assignments",
JSON.stringify(assignments)
);

localStorage.setItem(
"submissions",
JSON.stringify(submissions)
);

updateDashboard();

}

function showPage(id){

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

}

function addStudents(){

let list =
document.getElementById(
"studentInput"
).value
.split("\n")
.map(x=>x.trim())
.filter(x=>x!="");

students.push(...list);

document.getElementById(
"studentInput"
).value="";

saveData();

renderStudents();
renderAttendance();
renderSubmission();

}

function renderStudents(){

let ul =
document.getElementById(
"studentList"
);

ul.innerHTML="";

students.forEach((student,index)=>{

ul.innerHTML += `
<li>
${student}
<button
class="delete"
onclick="deleteStudent(${index})">
刪除
</button>
</li>
`;

});

}

function deleteStudent(index){

students.splice(index,1);

saveData();

renderStudents();
renderAttendance();
renderSubmission();

}

function createAssignment(){

let name =
document.getElementById(
"assignmentName"
).value;

let due =
document.getElementById(
"dueDate"
).value;

if(!name)return;

assignments.push({
name:name,
due:due
});

document.getElementById(
"assignmentName"
).value="";

saveData();

renderAssignments();
renderSubmission();

}

function renderAssignments(){

let ul =
document.getElementById(
"assignmentList"
);

ul.innerHTML="";

assignments.forEach((a,index)=>{

ul.innerHTML += `
<li>
${a.name}
(${a.due})
<button
class="delete"
onclick="deleteAssignment(${index})">
刪除
</button>
</li>
`;

});

}

function deleteAssignment(index){

assignments.splice(index,1);

saveData();

renderAssignments();
renderSubmission();

}

function renderAttendance(){

let body =
document.getElementById(
"attendanceBody"
);

body.innerHTML="";

students.forEach(student=>{

body.innerHTML += `
<tr>
<td>${student}</td>
<td>
<input type="checkbox">
</td>
</tr>
`;

});

}

function renderSubmission(){

let body =
document.getElementById(
"submissionBody"
);

body.innerHTML="";

students.forEach(student=>{

assignments.forEach(a=>{

let key =
student + "_" + a.name;

let status =
submissions[key];

body.innerHTML += `
<tr>

<td>${student}</td>

<td>${a.name}</td>

<td>

<button
class="submitBtn"
onclick="
toggleSubmit(
'${student}',
'${a.name}'
)">
${status ?
'已繳交'
:
'未繳交'}
</button>

</td>

</tr>
`;

});

});

updateDashboard();

}

function toggleSubmit(
student,
assignment
){

let key =
student + "_" + assignment;

submissions[key] =
!submissions[key];

saveData();

renderSubmission();

}

function generateReminder(){

let ul =
document.getElementById(
"reminderList"
);

ul.innerHTML="";

students.forEach(student=>{

assignments.forEach(a=>{

let key =
student + "_" + a.name;

if(!submissions[key]){

ul.innerHTML += `
<li class="remind">
${student}
未繳交
${a.name}
</li>
`;

}

});

});

}

function updateDashboard(){

document.getElementById(
"studentCount"
).innerText =
students.length;

document.getElementById(
"assignmentCount"
).innerText =
assignments.length;

let missing = 0;

students.forEach(student=>{

assignments.forEach(a=>{

let key =
student+"_"+a.name;

if(!submissions[key])
missing++;

});

});

document.getElementById(
"missingCount"
).innerText =
missing;

}

renderStudents();
renderAssignments();
renderAttendance();
renderSubmission();
updateDashboard();

</script>

</body>
</html>
