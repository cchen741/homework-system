<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>作業管理系統 V2</title>

https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css

<style>

body{
    background:#f5f6fa;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:#0d6efd;
    color:white;
    padding:20px;
}

.sidebar h3{
    margin-bottom:30px;
}

.sidebar ul{
    list-style:none;
    padding:0;
}

.sidebar li{
    padding:12px;
    cursor:pointer;
}

.sidebar li:hover{
    background:rgba(255,255,255,.2);
}

.main{
    margin-left:270px;
    padding:20px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.table{
    background:white;
}

</style>

</head>

<body>

<div class="sidebar">

<h3>📚 作業管理系統</h3>

<ul>
<li>📊 儀表板</li>
<li>👨‍🎓 學生管理</li>
<li>📝 作業管理</li>
<li>✅ 點名管理</li>
<li>⚠️ 催繳管理</li>
</ul>

</div>

<div class="main">

<h2 class="mb-4">教師後台</h2>

<div class="row">

<div class="col-md-3">
<div class="card p-3">
<h5>學生總數</h5>
<h2 id="studentCount">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h5>作業總數</h5>
<h2 id="assignmentCount">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h5>未繳交</h5>
<h2 id="missingCount">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h5>出席率</h5>
<h2 id="attendanceRate">0%</h2>
</div>
</div>

</div>

<hr>

<h3>學生管理</h3>

<textarea class="form-control"
id="studentInput"
rows="5"
placeholder="一行一位學生"></textarea>

<br>

<button class="btn btn-primary"
onclick="importStudents()">
匯入學生
</button>

<ul id="studentList"
class="mt-3"></ul>

<hr>

<h3>建立作業</h3>

<div class="row">

<div class="col-md-4">
<input
class="form-control"
id="assignmentName"
placeholder="作業名稱">
</div>

<div class="col-md-3">
<input
class="form-control"
type="date"
id="dueDate">
</div>

<div class="col-md-2">
<button
class="btn btn-success"
onclick="createAssignment()">
新增作業
</button>
</div>

</div>

<ul id="assignmentList"
class="mt-3"></ul>

<hr>

<h3>點名管理</h3>

<table class="table">

<thead>
<tr>
<th>學生</th>
<th>出席</th>
</tr>
</thead>

<tbody id="attendanceBody"></tbody>

</table>

<hr>

<h3>作業繳交管理</h3>

<table class="table table-bordered">

<thead>

<tr>
<th>學生</th>
<th>作業</th>
<th>狀態</th>
</tr>

</thead>

<tbody id="homeworkBody"></tbody>

</table>

<hr>

<h3>催繳名單</h3>

<button
class="btn btn-danger"
onclick="showReminder()">
產生催繳名單
</button>

<ul id="reminderList"
class="mt-3"></ul>

</div>

<script>

let students =
JSON.parse(localStorage.getItem("students")) || [];

let assignments =
JSON.parse(localStorage.getItem("assignments")) || [];

let submissions =
JSON.parse(localStorage.getItem("submissions")) || {};

function save(){

localStorage.setItem(
"students",
JSON.stringify(students));

localStorage.setItem(
"assignments",
JSON.stringify(assignments));

localStorage.setItem(
"submissions",
JSON.stringify(submissions));

updateDashboard();

}

function importStudents(){

students =
document.getElementById("studentInput")
.value
.split("\n")
.filter(x=>x.trim()!="");

save();

renderStudents();
renderAttendance();
renderHomework();

}

function createAssignment(){

const name=
document.getElementById(
"assignmentName"
).value;

const due=
document.getElementById(
"dueDate"
).value;

if(!name)return;

assignments.push({
name,due
});

save();

renderAssignments();
renderHomework();

}

function renderStudents(){

const ul=
document.getElementById(
"studentList");

ul.innerHTML="";

students.forEach(x=>{

ul.innerHTML +=
`<li>${x}</li>`;

});

}

function renderAssignments(){

const ul=
document.getElementById(
"assignmentList");

ul.innerHTML="";

assignments.forEach(a=>{

ul.innerHTML +=
`<li>${a.name} (${a.due})</li>`;

});

}

function renderAttendance(){

const body=
document.getElementById(
"attendanceBody");

body.innerHTML="";

students.forEach(s=>{

body.innerHTML+=`
<tr>
<td>${s}</td>
<td>
<input type="checkbox">
</td>
</tr>
`;

});

}

function renderHomework(){

const body=
document.getElementById(
"homeworkBody");

body.innerHTML="";

students.forEach(student=>{

assignments.forEach(a=>{

const key=
student+"_"+a.name;

const submitted=
submissions[key];

body.innerHTML += `
<tr>
<td>${student}</td>
<td>${a.name}</td>
<td>
<button
class="btn btn-sm ${
submitted ?
'btn-success' :
'btn-warning'
}"
onclick="
toggleSubmit(
'${student}',
'${a.name}'
)">
${submitted ?
'已繳交' :
'未繳交'}
</button>
</td>
</tr>
`;

});

});

updateDashboard();

}

function toggleSubmit(student,assignment){

const key=
student+"_"+assignment;

submissions[key]=
!submissions[key];

save();

renderHomework();

}

function showReminder(){

const ul=
document.getElementById(
"reminderList");

ul.innerHTML="";

students.forEach(student=>{

assignments.forEach(a=>{

const key=
student+"_"+a.name;

if(!submissions[key]){

ul.innerHTML +=
`<li style="color:red">
${student}
未繳交
${a.name}
</li>`;

}

});

});

}

function updateDashboard(){

document.getElementById(
"studentCount"
).innerText=
students.length;

document.getElementById(
"assignmentCount"
).innerText=
assignments.length;

let missing=0;

students.forEach(student=>{

assignments.forEach(a=>{

const key=
student+"_"+a.name;

if(!submissions[key])
missing++;

});

});

document.getElementById(
"missingCount"
).innerText=
missing;

document.getElementById(
"attendanceRate"
).innerText=
"100%";

}

renderStudents();
renderAssignments();
renderAttendance();
renderHomework();
updateDashboard();

</script>

</body>
</html>
